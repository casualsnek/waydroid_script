[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waydroid-script"
version = "1.3.0"
description = "Script to add GApps and other extras to Waydroid"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "tqdm",
]

[project.optional-dependencies]
interactive = ["InquirerPy"]

[project.scripts]
waydroid-script = "main:main"

[tool.setuptools]
py-modules = ["main"]